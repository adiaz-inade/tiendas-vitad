<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00879B">
<title>Vitad · Inventario en tienda</title>
<link rel="icon" href="data:,">
<style>
:root{--tinta:#101820;--banner:#00879B;--acento:#00BED6;--fondo:#fff;--gris:#EEF4F6;--linea:#C9D8DD;--sutil:#51606B;
--alerta:#8C1D18;--alerta-f:#FBECEA;--espera:#7A4E00;--espera-f:#FBF2E2;--ok:#1B5E43;--ok-f:#E6F2EC}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--tinta);background:var(--fondo);font-size:16px;line-height:1.4}
header{background:var(--banner);color:#fff;padding:calc(.9rem + env(safe-area-inset-top,0px)) 1rem .9rem}
header h1{margin:0;font-size:1.15rem;font-weight:700}
header p{margin:.25rem 0 0;font-size:.8rem;opacity:.92}
main{max-width:44rem;margin:0 auto;padding:1rem 1rem calc(5rem + env(safe-area-inset-bottom))}
input[type=search],input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:1rem;padding:.7rem .8rem;border:2px solid var(--linea);border-radius:.6rem;outline:none;-webkit-appearance:none;background:#fff;color:var(--tinta)}
input:focus,textarea:focus{border-color:var(--banner)}
textarea{min-height:5rem;resize:vertical}
.ayuda{color:var(--sutil);font-size:.85rem;margin:.5rem 0 1rem}
ul.res{list-style:none;margin:0;padding:0}
ul.res li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:.75rem .2rem;border-bottom:1px solid var(--linea);cursor:pointer;min-height:2.6rem}
ul.res li button:focus-visible{outline:2px solid var(--banner);outline-offset:2px}
.rn{font-weight:600}.rm{font-size:.8rem;color:var(--sutil)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;font:inherit;font-size:.9rem;background:var(--gris);color:var(--tinta);border:1px solid var(--linea);border-radius:.5rem;padding:.5rem .8rem;min-height:2.4rem;cursor:pointer}
.btn.prim{background:var(--banner);color:#fff;border-color:var(--banner);font-weight:600;font-size:1rem;min-height:2.9rem;width:100%}
.btn.prim[disabled]{opacity:.45;cursor:not-allowed}
.barra{display:flex;gap:.5rem;justify-content:space-between;margin-bottom:.8rem}
h2{font-size:1.2rem;margin:.2rem 0 .1rem}
h3.sec{font-size:1rem;margin:1.3rem 0 .5rem}
.meta{color:var(--sutil);font-size:.85rem;margin:0 0 .6rem}
.visitas{background:var(--gris);border-radius:.5rem;padding:.5rem .7rem;font-size:.88rem;margin:.35rem 0 .6rem;font-variant-numeric:tabular-nums}
.visitas .vm{font-size:.72rem;color:var(--sutil);margin-top:.15rem}
.aviso{border-radius:.5rem;padding:.6rem .75rem;font-size:.88rem;margin:.6rem 0}
.aviso.espera{background:var(--espera-f);color:var(--espera)}
.aviso.alerta{background:var(--alerta-f);color:var(--alerta)}
.aviso.ok{background:var(--ok-f);color:var(--ok)}
.aviso.gris{background:var(--gris);color:var(--tinta)}
.cifras{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin:.7rem 0 1rem}
.cifra{background:var(--gris);border-radius:.6rem;padding:.6rem .7rem}
.cifra b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.cifra span{font-size:.78rem;color:var(--sutil)}
.cifra.rojo{background:var(--alerta-f)}.cifra.rojo b{color:var(--alerta)}
.cifra.ambar{background:var(--espera-f)}.cifra.ambar b{color:var(--espera)}
section.caja{border:1px solid var(--linea);border-radius:.6rem;margin:0 0 .9rem;overflow:hidden}
section.caja>h3{margin:0;font-size:.95rem;padding:.6rem .75rem}
section.caja.alerta>h3{background:var(--alerta-f);color:var(--alerta)}
section.caja.espera>h3{background:var(--espera-f);color:var(--espera)}
section.caja.gris>h3{background:var(--gris)}
.fila{display:flex;justify-content:space-between;gap:.6rem;padding:.55rem .75rem;border-top:1px solid var(--linea);font-size:.9rem}
.fila .n{flex:1;min-width:0}
.fila .c{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.fila .g{display:block;font-size:.75rem;color:var(--sutil)}
.preg{padding:.6rem .75rem;border-top:1px solid var(--linea)}
.preg .q{font-size:.9rem;font-weight:600}
.preg .d{font-size:.78rem;color:var(--sutil);margin:.1rem 0 .4rem;font-variant-numeric:tabular-nums}
.ops{display:flex;flex-wrap:wrap;gap:.35rem}
.ops button{font:inherit;font-size:.86rem;padding:.45rem .65rem;min-height:2.3rem;border-radius:.5rem;border:1px solid var(--linea);background:#fff;color:var(--tinta);cursor:pointer}
.ops button[aria-pressed=true]{background:var(--banner);border-color:var(--banner);color:#fff;font-weight:600}
.ops.alerta button[aria-pressed=true]{background:var(--alerta);border-color:var(--alerta)}
.campo{margin:.5rem 0}
.campo label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.3rem}
.miniaturas{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.miniaturas figure{margin:0;position:relative}
.miniaturas img{width:4.6rem;height:4.6rem;object-fit:cover;border-radius:.4rem;border:1px solid var(--linea);display:block}
.miniaturas button{position:absolute;top:-.4rem;right:-.4rem;width:1.6rem;height:1.6rem;border-radius:50%;border:none;background:var(--alerta);color:#fff;font-size:.9rem;cursor:pointer;line-height:1}
label.foto{display:inline-flex;align-items:center;gap:.35rem;font-size:.9rem;padding:.5rem .8rem;min-height:2.4rem;border-radius:.5rem;border:1px dashed var(--banner);color:var(--banner);cursor:pointer;font-weight:600}
label.foto input{position:absolute;opacity:0;width:1px;height:1px}
details.grupo{border:1px solid var(--linea);border-radius:.6rem;margin:0 0 .7rem;overflow:hidden}
details.grupo>summary{list-style:none;cursor:pointer;padding:.7rem .75rem;background:var(--gris);display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;min-height:2.6rem}
details.grupo>summary::-webkit-details-marker{display:none}
details.grupo>summary .t{font-weight:700}
details.grupo>summary .s{font-size:.8rem;color:var(--sutil);white-space:nowrap;font-variant-numeric:tabular-nums}
details.grupo>summary .t::before{content:"▸ ";color:var(--banner)}
details.grupo[open]>summary .t::before{content:"▾ "}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:.45rem .5rem;border-top:1px solid var(--linea);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:.72rem;color:var(--sutil);font-weight:600;background:#fff}
th:first-child,td:first-child{text-align:left;white-space:normal}
tr.a td{background:var(--espera-f)}tr.z td{background:var(--alerta-f)}
tr.a td:first-child,tr.z td:first-child{font-weight:600}
.etq{display:inline-block;font-size:.68rem;border-radius:.3rem;padding:.05rem .3rem;margin-left:.25rem;vertical-align:middle}
.etq.a{background:var(--espera);color:#fff}.etq.z{background:var(--alerta);color:#fff}.etq.x{background:var(--sutil);color:#fff}
#estado{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);padding:.55rem 1rem calc(.55rem + env(safe-area-inset-bottom));font-size:.82rem;display:flex;gap:.6rem;align-items:center;justify-content:space-between}
#estado.oculto{display:none}
#estado.rojo{background:var(--alerta-f);color:var(--alerta)}
footer{color:var(--sutil);font-size:.78rem;margin-top:1.4rem;border-top:1px solid var(--linea);padding-top:.8rem}
footer p{margin:.35rem 0}
.oculto{display:none}
@media(min-width:34rem){.cifras{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>Vitad · Inventario en tienda</h1>
  <p id="cortes">Cargando…</p>
</header>
<main>
  <div id="vBuscar">
    <label for="q" class="ayuda" style="display:block;margin:0 0 .4rem">Busque su tienda por nombre, número o ciudad</label>
    <input id="q" type="search" autocomplete="off" placeholder="Ej.: Carulla 184, Jumbo Calle 80, Olímpica Barranquilla">
    <p class="ayuda" id="nres"></p>
    <ul class="res" id="res"></ul>
  </div>
  <div id="vTienda" class="oculto"></div>
  <div id="vVisita" class="oculto"></div>
  <footer id="pie"></footer>
</main>
<div id="estado" class="oculto"><span id="estadoTxt"></span><button type="button" class="btn" id="reintentar">Enviar ahora</button></div>
<script>
(function(){
"use strict";
var IND=null, META=null, TIENDA=null, V=null;
var VERSION="visita-1.0";
var $=function(id){return document.getElementById(id)};
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var SECCIONES=[
  {k:"saludable",n:"Saludable",g:"Saludable"},
  {k:"pasteleria",n:"Masivos pastelería",g:"Masivos pastelería"},
  {k:"snacks",n:"Masivos snacks",g:"Masivos snacks"},
  {k:"lactea",n:"Bebida láctea",g:"Láctea"},
  {k:"otras",n:"Otras / adicionales",g:null}
];
var OPC_REVISAR=["En góndola","En bodega sin surtir","Ajustar inventario"];
function fnum(x){return x==null?"—":Number(x).toLocaleString("es-CO",{maximumFractionDigits:0})}
function fdia(s){var p=s.split("-");return parseInt(p[2],10)+"-"+MESES[parseInt(p[1],10)-1]}
function fdias(d){if(d==null)return "sin venta";return d>365?"más de 365":fnum(d)}
function fsv(s){if(s==null)return "sin venta en el último año";if(s===0)return "vendió el último día con venta";return fnum(s)+" días"}
function norm(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s+/g," ").trim()}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function ahora(){var d=new Date(),z=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+" "+z(d.getHours())+":"+z(d.getMinutes())+":"+z(d.getSeconds())}
function uid(){try{return crypto.randomUUID()}catch(e){return "v"+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}}

/* ------------------------------------------------------------ almacenamiento local */
var LS={get:function(k,def){try{var v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}},
        set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
        del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var LS_OK=(function(){try{localStorage.setItem("_p","1");localStorage.removeItem("_p");return true}catch(e){return false}})();
var DB=null, MEMFOTOS={}, MEMCOLA={};
function abrirDB(){return new Promise(function(ok){
  try{var r=indexedDB.open("vitad_visitas",1);
    r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains("fotos"))d.createObjectStore("fotos",{keyPath:"id"});if(!d.objectStoreNames.contains("cola"))d.createObjectStore("cola",{keyPath:"visita_id"})};
    r.onsuccess=function(){DB=r.result;
      /* Safari cierra la conexion al ir a la camara o al fondo: se marca cerrada y se reabre en el proximo uso */
      DB.onclose=function(){DB=null};
      DB.onversionchange=function(){try{DB.close()}catch(e){}DB=null};
      ok(true)};
    r.onerror=function(){ok(false)};r.onblocked=function(){ok(false)};
  }catch(e){ok(false)}})}
var SIN_IDB=false;
function conDB(){if(DB||SIN_IDB)return Promise.resolve();return abrirDB().then(function(x){if(!x)SIN_IDB=true})}
function memoria(store,modo,fn){var M=store==="fotos"?MEMFOTOS:MEMCOLA;
  if(modo==="readonly")return Object.keys(M).map(function(k){return M[k]});
  return fn({put:function(o){M[o.id||o.visita_id]=o},delete:function(k){delete M[k]}})}
function txUnaVez(store,modo,fn){return new Promise(function(ok,mal){
  var t;try{t=DB.transaction(store,modo)}catch(e){mal(e);return}
  var s=t.objectStore(store),res;
  if(modo==="readonly"){var q=s.getAll();q.onsuccess=function(){ok(q.result)};q.onerror=function(){mal(q.error)};return}
  try{res=fn({put:function(o){s.put(o)},delete:function(k){s.delete(k)}})}catch(e){mal(e);return}
  t.oncomplete=function(){ok(res)};t.onerror=function(){mal(t.error)};t.onabort=function(){mal(t.error||new Error("abort"))};})}
function tx(store,modo,fn){
  return conDB().then(function(){
    if(!DB)return memoria(store,modo,fn);
    return txUnaVez(store,modo,fn).catch(function(e){
      /* conexion cerrada o perdida: reabrir y reintentar una vez */
      try{DB&&DB.close()}catch(_){}DB=null;
      return conDB().then(function(){if(!DB)return memoria(store,modo,fn);return txUnaVez(store,modo,fn)});
    });
  })}
function todas(store){return tx(store,"readonly")}

/* ------------------------------------------------------------ inventario (vista de tienda) */
function pintarCortes(){
  var partes=[];
  Object.keys(META.cadenas).forEach(function(c){partes.push(c+": inventario al "+fdia(META.cadenas[c].foto_mas_reciente)+", venta al "+fdia(META.cadenas[c].venta_hasta))});
  $("cortes").textContent=partes.join(" · ");
  var pie=$("pie");pie.textContent="";
  ["Existencias: unidades del último inventario que reportó la tienda. Cada tienda muestra la fecha de ese inventario.",
   "Días de inventario: existencias divididas por la venta diaria promedio de los últimos "+META.ventana+" días.",
   "Revise primero: referencias con existencias y más de "+META.umbral_sin_venta+" días sin venta. Los días se cuentan hasta la última fecha con venta de la cadena, que se actualiza cada semana. Suelen estar en bodega o mal exhibidas.",
   "Agotada: cero existencias en el último inventario, con venta en los últimos "+META.ventana+" días.",
   "Fuente: reportes de venta e inventario de cada cadena. Actualizado el "+META.generado.replace(" "," a las ")+"."
  ].forEach(function(t){pie.appendChild(el("p",null,t))});
}
function buscar(){
  var q=norm($("q").value), ul=$("res"); ul.textContent="";
  if(q.length<2){$("nres").textContent=IND.length+" tiendas. Escriba al menos dos letras.";return}
  var pal=q.split(" "), hits=IND.filter(function(t){return pal.every(function(p){return t.k.indexOf(p)>=0})});
  $("nres").textContent=hits.length===0?"No encontré tiendas con ese nombre.":(hits.length>40?"Mostrando 40 de "+hits.length+". Escriba más para acotar.":hits.length+(hits.length===1?" tienda":" tiendas"));
  hits.slice(0,40).forEach(function(t){
    var li=el("li"), b=el("button"); b.type="button";
    b.appendChild(el("div","rn",t.n));
    b.appendChild(el("div","rm",[t.c===t.b||!t.b?t.c:t.c+" · "+t.b,t.ci,"inventario al "+fdia(t.f)].filter(Boolean).join(" · ")));
    b.addEventListener("click",function(){abrir(t.id,true)});
    li.appendChild(b); ul.appendChild(li);
  });
}
function cifra(valor,rotulo,cls){var d=el("div","cifra"+(cls?" "+cls:""));d.appendChild(el("b",null,valor));d.appendChild(el("span",null,rotulo));return d}
function listaCaja(titulo,cls,filas){
  var s=el("section","caja "+cls); s.appendChild(el("h3",null,titulo));
  filas.forEach(function(f){var r=el("div","fila");var n=el("div","n");n.appendChild(document.createTextNode(f.n));n.appendChild(el("span","g",f.g));r.appendChild(n);r.appendChild(el("div","c",f.c));s.appendChild(r)});
  return s;
}
function refsMarcadas(j){
  var rev=[],ago=[];
  j.grupos.forEach(function(g){g.refs.forEach(function(r){
    if(r.a)rev.push({n:r.n,ean:r.ean,g:g.g,e:r.e,s:r.s,v:r.v});
    if(r.z)ago.push({n:r.n,ean:r.ean,g:g.g,e:r.e,s:r.s,v:r.v});
  })});
  rev.sort(function(a,b){return b.e-a.e}); ago.sort(function(a,b){return b.v-a.v});
  return {rev:rev,ago:ago};
}
var MESES_LARGO=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function lineaVisitas(vi){
  var d=el("div","visitas"), mes=vi.mes?MESES_LARGO[parseInt(vi.mes.slice(5,7),10)-1]:"";
  var ef=vi.ef&&vi.ef.length, mc=!!vi.mc;
  var f1=el("div");f1.appendChild(el("b",null,"Eficacia: "));
  f1.appendChild(document.createTextNode(ef?vi.ef.join(" · ")+(vi.ef_nota?" ("+vi.ef_nota+")":""):"sin visita en el rutero"));d.appendChild(f1);
  var f2=el("div");f2.appendChild(el("b",null,"Mercadeo compartido: "));
  f2.appendChild(document.createTextNode(mc?vi.mc+", sin día fijo en el archivo":"sin visita"));d.appendChild(f2);
  if(mes)d.appendChild(el("div","vm","Rutero de "+mes));
  return d;
}
function pintarTienda(j){
  var v=$("vTienda"); v.textContent="";
  var barra=el("div","barra");
  var volver=el("button","btn","← Buscar otra tienda"); volver.type="button";
  volver.addEventListener("click",function(){history.pushState(null,"",location.pathname);mostrar("vBuscar")});
  var comp=el("button","btn","Compartir"); comp.type="button";
  comp.addEventListener("click",function(){
    var url=location.origin+location.pathname+"?t="+encodeURIComponent(j.id);
    if(navigator.share){navigator.share({title:j.tienda,url:url}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){comp.textContent="Link copiado"},function(){prompt("Copie el link:",url)})}
    else{prompt("Copie el link:",url)}
  });
  barra.appendChild(volver); barra.appendChild(comp); v.appendChild(barra);
  v.appendChild(el("h2",null,j.tienda));
  v.appendChild(lineaVisitas(j.visitas||{}));
  v.appendChild(el("p","meta",[j.cadena===j.bandera?j.cadena:j.cadena+" · "+j.bandera,j.ciudad].filter(Boolean).join(" · ")));
  v.appendChild(el("p","meta","Inventario al "+fdia(j.foto)+" · venta hasta el "+fdia(j.venta_hasta)));
  if(j.vieja){v.appendChild(el("div","aviso espera","Esta tienda no reporta inventario desde el "+fdia(j.foto)+", "+j.rezago+" días antes que el resto de la cadena. Las cifras pueden no reflejar la góndola de hoy."))}
  var reg=el("button","btn prim","Registrar visita a esta tienda"); reg.type="button";
  reg.addEventListener("click",function(){history.pushState({t:j.id,v:1},"","?t="+encodeURIComponent(j.id)+"&visita=1");abrirVisita()});
  v.appendChild(reg);
  var T=j.total, c=el("div","cifras");
  c.appendChild(cifra(fnum(T.e),"unidades en existencia"));
  c.appendChild(cifra(fdias(T.d),"días de inventario",T.d!=null&&T.d<META.riesgo_dias?"rojo":null));
  c.appendChild(cifra(fnum(T.na),"para revisar",T.na>0?"ambar":null));
  c.appendChild(cifra(fnum(T.ag),"agotadas",T.ag>0?"rojo":null));
  v.appendChild(c);
  var dv=Math.round((new Date(META.hoy)-new Date(j.venta_hasta))/864e5);
  if(dv>META.aviso_venta_dias)v.appendChild(el("div","aviso espera","La venta de esta cadena llega hasta el "+fdia(j.venta_hasta)+". Los días sin venta pueden estar desactualizados."));
  var m=refsMarcadas(j);
  if(m.rev.length)v.appendChild(listaCaja("Revise primero: con existencias y más de "+META.umbral_sin_venta+" días sin venta al "+fdia(j.venta_hasta)+" ("+m.rev.length+")","espera",m.rev.map(function(r){return{n:r.n,g:r.g,c:fnum(r.e)+" unid · "+fsv(r.s)}})));
  if(m.ago.length)v.appendChild(listaCaja("Agotadas: sin existencias y con venta reciente ("+m.ago.length+")","alerta",m.ago.map(function(r){return{n:r.n,g:r.g,c:fnum(r.v)+" vendidas en "+META.ventana+" d"}})));
  if(!m.rev.length&&!m.ago.length)v.appendChild(el("div","aviso ok","Todo en orden: ninguna referencia lleva más de "+META.umbral_sin_venta+" días sin venta y ninguna está agotada."));
  j.grupos.forEach(function(g){
    var d=el("details","grupo"); if(g.na||g.ag)d.open=true;
    var s=el("summary"); s.appendChild(el("span","t",g.g));
    s.appendChild(el("span","s",fnum(g.e)+" unid · "+fdias(g.d)+(g.d!=null?" días":"")));
    d.appendChild(s);
    var tb=el("table"), th=el("tr");
    ["Referencia","Unid","Días","Vta "+META.ventana+"d","Sin venta"].forEach(function(h){th.appendChild(el("th",null,h))});
    var thead=el("thead");thead.appendChild(th);tb.appendChild(thead);var body=el("tbody");
    g.refs.forEach(function(r){
      var tr=el("tr",r.z?"z":(r.a?"a":null)), td=el("td",null,r.n);
      if(r.a)td.appendChild(el("span","etq a","revisar")); if(r.z)td.appendChild(el("span","etq z","agotada")); if(r.x)td.appendChild(el("span","etq x","descontinuada"));
      tr.appendChild(td);
      tr.appendChild(el("td",null,fnum(r.e)));
      tr.appendChild(el("td",null,r.d==null?"—":(r.d>365?">365":fnum(r.d))));
      tr.appendChild(el("td",null,fnum(r.v)));

function distanciaM(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return Math.round(2*R*Math.asin(Math.sqrt(h)))}

    ok(c.toDataURL("image/jpeg",0.72).split(",")[1])};
  img.onerror=function(){URL.revokeObjectURL(url);mal(new Error("imagen"))};img.src=url;})}

var ENVIANDO=false;
function enviar(obj){return fetch(META.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj),redirect:"follow"}).then(function(r){return r.json()})}
function procesarCola(){
  if(ENVIANDO||!META)return Promise.resolve();ENVIANDO=true;var errCodigo=false,errRed=false;
  return todas("cola").then(function(cola){
    return cola.reduce(function(p,it){return p.then(function(){
      if(errCodigo)return;
      var cod=(LS.get("vitad_persona",{}).codigo)||it.carga.codigo;it.carga.codigo=cod;
      return enviar(it.carga).then(function(r){
        if(r&&r.ok)return tx("cola","readwrite",function(s){s.delete(it.visita_id)});
        if(r&&r.error==="codigo"){errCodigo=true}else{errRed=true}
      },function(){errRed=true})})},Promise.resolve());
  }).then(function(){return Promise.all([todas("fotos"),todas("cola")])}).then(function(x){
    var fotos=x[0].filter(function(f){return f.estado==="pendiente"}),colaIds=x[1].map(function(c){return c.visita_id});
    return fotos.reduce(function(p,f){return p.then(function(){
      if(errCodigo||colaIds.indexOf(f.visita_id)>=0)return;
      return enviar({codigo:LS.get("vitad_persona",{}).codigo,tipo:"foto",foto:{visita_id:f.visita_id,tienda_id:f.tienda_id,tienda:f.tienda,grupo:f.grupo,archivo:f.archivo,mime:f.mime,data:f.data}}).then(function(r){
        if(r&&r.ok)return tx("fotos","readwrite",function(s){s.delete(f.id)});
        if(r&&r.error==="codigo"){errCodigo=true}else{errRed=true}
      },function(){errRed=true})})},Promise.resolve());
  }).then(function(){ENVIANDO=false;return pintarEstado(errCodigo,errRed)},function(){ENVIANDO=false;return pintarEstado(false,true)});
}
function pintarEstado(errCodigo,errRed){
  return Promise.all([todas("cola"),todas("fotos")]).then(function(x){
    var nv=x[0].length,nf=x[1].filter(function(f){return f.estado==="pendiente"}).length,bar=$("estado"),t=$("estadoTxt"),msg=$("msgEnvio");
    if(!nv&&!nf){bar.className="oculto";if(msg){msg.className="aviso ok";msg.textContent="Listo: la visita y sus fotos llegaron a la hoja de visitas."}return}
    var txt=(nv?nv+(nv===1?" visita":" visitas"):"")+(nv&&nf?" y ":"")+(nf?nf+(nf===1?" foto":" fotos"):"")+" pendientes por enviar.";
    if(errCodigo)txt="La palabra clave no es válida. Corríjala en Registrar visita y presione Enviar ahora. "+txt;
    else if(errRed)txt="Sin señal o la hoja no respondió. Se guardó en este celular y se enviará solo. "+txt;
    bar.className=errCodigo?"rojo":"";t.textContent=txt;
    if(msg){msg.className=errCodigo?"aviso alerta":"aviso espera";msg.textContent=errCodigo?"La visita quedó guardada en este celular, pero la palabra clave no es válida. Corríjala y presione Enviar ahora.":"La visita quedó guardada en este celular. Se enviará sola cuando haya señal; no cierre ni borre los datos del navegador."}
  })}
